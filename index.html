<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación 💌</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container" id="mainContent">
    <!-- GIF inicial -->
    <img src="SNOOPY.gif" alt="gif" class="gif">

    <div class="question">MI AMOR!!!</div>
<div class="sub">
  Tengo una pequeña petición... 👉👈 <br>
  ¿Me das permiso para ir al Santiago?
</div>

    <div class="buttons">
      <button class="yes" id="btnYes">SI</button>
      <button class="no" id="btnNo">NO!!!</button>
    </div>
  </div>

  <!-- Contenido que aparece al dar SÍ -->
<div class="respuesta" id="respuesta">
  <img src="7xZq.gif" alt="gif respuesta" class="gifRespuesta">

  <div class="mensaje">
    ¡Sabía que dirías que sí!<br>
    Prometo portarme bien, responder mensajes,
    volver sano y salvo, y traerte un detallito ❤️🥰
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
